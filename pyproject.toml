[project]
name = "airlock"
version = "0.1.0"
description = "An inspection gateway that quarantines prompt injection and data exfiltration before it reaches a tool-using AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai-agents", "prompt-injection", "security", "guardrail"]

# The core (engine, gateway, audit, Ollama classifier) is pure standard library.
dependencies = []

[project.optional-dependencies]
# Thin adapter to expose Airlock over the real MCP wire protocol (planned).
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
